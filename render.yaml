services:
  - type: web
    name: yale-books
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python -c "from embeddings import get_model; get_model()"
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 2 --timeout 180
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://yalebooks-be079.web.app
      # set to "true" to bypass CAS and use the NetID-only demo login
      - key: DEMO_LOGIN
        value: "false"
      - key: HF_HOME
        value: /opt/render/project/src/backend/.cache/huggingface
      - key: FILEBASE_ACCESS_KEY
        sync: false
      - key: FILEBASE_SECRET_KEY
        sync: false
